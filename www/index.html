<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1120" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Gry towarzyskie na jednym telefonie. Bez kont i bez reklam." />
    <!-- Wersja testowa: bez indeksowania w wyszukiwarkach (robots.txt w podkatalogu GitHub Pages nie działa). -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Gry towarzyskie</title>
    <!-- Ikona jako lokalny data URI (emoji) — zero zapytań sieciowych. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B2%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header" hidden>
        <button id="back-button" class="icon-button" type="button" aria-label="Wróć do poprzedniego ekranu" hidden>
          ←
        </button>
        <h1 id="screen-title" class="app-title">Gry towarzyskie</h1>
      </header>

      <main id="app" class="screen-container"></main>

      <noscript>
        <p id="noscript-message" class="noscript">Ta aplikacja wymaga włączonego JavaScriptu.</p>
      </noscript>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
