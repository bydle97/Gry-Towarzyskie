# Budowanie APK do testów (wersja debug, podpisana kluczem debug z Gradle).
#
# Uruchomienie:
#   - ręcznie: zakładka Actions -> "Android APK (debug)" -> Run workflow,
#   - automatycznie: wypchnięcie tagu apk-* (np. git tag apk-1 && git push origin apk-1).
# Wynik: artefakt "gry-towarzyskie-<tag lub gałąź>-debug" z plikiem APK (30 dni).
#
# Wymagania (Capacitor 8): Node >= 22, JDK 21 (sourceCompatibility 21 w
# android/app/capacitor.build.gradle). Android SDK jest już na runnerze ubuntu-latest.
# versionCode = numer uruchomienia workflow (GITHUB_RUN_NUMBER, czytany w
# android/app/build.gradle), więc każdy kolejny APK instaluje się jako aktualizacja.
#
# Wersje akcji sprawdzone w repozytoriach actions/* (listopad 2026):
# checkout v7, setup-node v7, setup-java v6, upload-artifact v7.
# Workflow nie potrzebuje żadnych sekretów i nie zmienia repozytorium.
name: Android APK (debug)

on:
  workflow_dispatch:
  push:
    tags:
      - 'apk-*'

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Budowanie APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Java (Temurin 21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Zależności npm (Capacitor)
        run: npm ci

      - name: Kopiowanie www/ do projektu Androida
        run: npx cap sync android

      - name: Sprawdzenie skopiowanych plików
        run: |
          for path in index.html js/main.js css/base.css css/fonts.css js/vendor/native-bridge.js locales/pl.json locales/en.json data/pl data/en fonts fonts/LICENSES.md; do
            test -e "android/app/src/main/assets/public/$path" || { echo "Brak: $path"; exit 1; }
          done

      - name: Budowanie (gradlew assembleDebug)
        working-directory: android
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle.log

      # Przy błędzie: najważniejsze linie z logu Gradle jako adnotacje (widoczne
      # na stronie uruchomienia, także bez otwierania pełnego logu).
      - name: Diagnostyka błędu Gradle
        if: failure()
        working-directory: android
        run: |
          test -f gradle.log || exit 0
          grep -n -E "What went wrong|error:|ERROR:|FAILURE|Execution failed|AAPT|not found|Could not" gradle.log \
            | grep -v -E "^[0-9]+:[[:space:]]+at " | head -15 | while IFS= read -r line; do
              echo "::error title=Gradle::${line:0:600}"
            done
          grep -n -A6 "What went wrong" gradle.log | head -14 | while IFS= read -r line; do
            echo "::error title=Gradle (szczegóły)::${line:0:600}"
          done

      - name: Nazwa i zawartość APK
        id: apk
        run: |
          name="gry-towarzyskie-${GITHUB_REF_NAME//\//-}-debug"
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          unzip -l "dist/$name.apk" | grep -E "assets/public/(index.html|locales/|data/|fonts/)|res/mipmap-xxxhdpi" | head -50
          for required in assets/public/index.html assets/public/locales/pl.json assets/public/data/pl/ assets/public/fonts/ assets/public/js/vendor/native-bridge.js res/mipmap-xxxhdpi; do
            unzip -l "dist/$name.apk" | grep -q "$required" || { echo "W APK brak: $required"; exit 1; }
          done

      - name: Wysłanie artefaktu
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/${{ steps.apk.outputs.name }}.apk
          retention-days: 30
          if-no-files-found: error
